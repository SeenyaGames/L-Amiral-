<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Amiral</title>
<style>
  :root {
    --bg: #0b1014;
    --card: #141b22;
    --line: #24303a;
    --mint: #5fbf9a;
    --text: #e8eef2;
    --muted: #8b9aa6;
    --amber: #e6b35a;
    --rose: #e07a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 16px 16px 110px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { background: none; border: 0; text-align: left; padding: 0; }
  .eyebrow { letter-spacing: .18em; font-size: 11px; color: var(--mint); margin: 0 0 4px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .04em; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
  .hero { margin: 22px 0 16px; }
  .hero h2 { margin: 0 0 6px; font-size: 22px; }
  .hero p { margin: 0; color: var(--muted); }
  .grid { display: grid; gap: 12px; }
  .tiles { grid-template-columns: 1fr; }
  @media (min-width: 720px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile, .panel, .row, .fiche {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .tile { text-align: left; padding: 18px; min-height: 120px; }
  .tile strong { display: block; font-size: 20px; margin-bottom: 6px; }
  .tile span, .muted { color: var(--muted); }
  .tile.wide { grid-column: 1 / -1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat { background: #10161c; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .stat b { display: block; font-size: 22px; color: var(--mint); }
  .days, .filters { display: flex; gap: 8px; overflow: auto; padding-bottom: 8px; }
  .pill, .btn, .dock button {
    border: 1px solid var(--line);
    background: #10161c;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .pill.on, .dock button.on { border-color: var(--mint); color: var(--mint); }
  .slot { width: 100%; text-align: left; padding: 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .slot small { color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .btn.mint { background: var(--mint); color: #062018; border-color: var(--mint); font-weight: 700; }
  .btn.ghost { background: transparent; }
  .form { display: grid; gap: 10px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  input, select, textarea {
    width: 100%;
    background: #0d1318;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
  }
  textarea { min-height: 90px; }
  .sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: grid; align-items: end; z-index: 20;
  }
  .sheet .panel { margin: 0 auto; width: min(560px, 100%); border-radius: 18px 18px 0 0; padding: 16px; max-height: 88vh; overflow: auto; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: #0b1014ee; border-top: 1px solid var(--line);
  }
  .dock button { font-size: 12px; padding: 10px 4px; }
  .btn.danger { border-color: var(--rose); color: var(--rose); background: transparent; }
  .score { display: flex; gap: 8px; }
  .score button { flex: 1; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: #10161c; font-weight: 700; }
  .score .ok { border-color: var(--mint); color: var(--mint); }
  .score .no { border-color: var(--rose); color: var(--rose); }
  .bar { height: 8px; background: #0d1318; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--mint); }
  .files { display: grid; gap: 10px; margin: 12px 0; }
  .files canvas, .files img { width: 100%; height: auto; display: block; border-radius: 12px; background: #fff; }
  .file-row pre { white-space: pre-wrap; margin: 0; background: #0d1318; border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="dock" id="dock"></nav>
<input id="picker" type="file" accept="image/*,application/pdf,.pdf,.txt" multiple hidden>
<div id="sheet"></div>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
const KEY = "lamiral-html-v1";
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const SUBJECTS = [
  ["maths","Maths"],["francais","Français"],["hg","Histoire-Géo"],["svt","SVT"],
  ["pc","Physique-Chimie"],["anglais","Anglais"],["espagnol","Espagnol"],["techno","Techno"],
  ["arts","Arts plastiques"],["musique","Musique"],["eps","EPS"],["emc","EMC"]
];
const PERIODS = [["08:00","09:00"],["09:00","10:00"],["10:15","11:15"],["11:15","12:15"],["13:30","14:30"],["14:30","15:30"],["15:30","16:30"],["16:30","17:30"]];
function course(day, start, end, subjectId, room) {
  return { id: "c-"+day+"-"+start, day, start, end, subjectId, room, teacher: "" };
}
const SEED = {
  view: "hub",
  basket: "menu",
  day: new Date().getDay() === 0 ? 0 : Math.min((new Date().getDay() + 6) % 7, 4),
  subject: "all",
  courses: [
    course(0,"08:00","09:00","maths","S.12"), course(0,"09:00","10:00","francais","S.08"),
    course(0,"10:15","11:15","hg","S.15"), course(0,"11:15","12:15","anglais","S.21"),
    course(0,"13:30","14:30","svt","Labo"), course(0,"14:30","15:30","techno","T1"),
    course(0,"15:30","16:30","eps","Gymnase"),
    course(1,"08:00","09:00","francais","S.08"), course(1,"09:00","10:00","maths","S.12"),
    course(1,"10:15","11:15","pc","Labo"), course(1,"11:15","12:15","espagnol","S.18"),
    course(1,"13:30","14:30","arts","Atelier"), course(1,"14:30","15:30","arts","Atelier"),
    course(1,"15:30","16:30","emc","S.04"),
    course(2,"08:00","09:00","maths","S.12"), course(2,"09:00","10:00","francais","S.08"),
    course(2,"10:15","11:15","eps","Gymnase"), course(2,"11:15","12:15","musique","S.mus."),
    course(3,"08:00","09:00","hg","S.15"), course(3,"09:00","10:00","anglais","S.21"),
    course(3,"10:15","11:15","maths","S.12"), course(3,"11:15","12:15","francais","S.08"),
    course(3,"13:30","14:30","svt","Labo"), course(3,"14:30","15:30","techno","T1"),
    course(3,"15:30","16:30","pc","Labo"),
    course(4,"08:00","09:00","anglais","S.21"), course(4,"09:00","10:00","maths","S.12"),
    course(4,"10:15","11:15","francais","S.08"), course(4,"11:15","12:15","hg","S.15"),
    course(4,"13:30","14:30","eps","Gymnase"), course(4,"14:30","15:30","eps","Gymnase")
  ],
  trainings: [
    { id: "t1", weekday: 1, start: "17:30", end: "19:00", place: "Gymnase", kind: "Entraînement" },
    { id: "t2", weekday: 3, start: "17:30", end: "19:00", place: "Gymnase", kind: "Entraînement" },
    { id: "t3", weekday: 5, start: "10:00", end: "11:30", place: "Gymnase", kind: "Match / tournoi" }
  ],
  matches: [
    { id: "m1", date: "2026-09-20", opponent: "Collège voisin", home: true, scoreFor: 42, scoreAgainst: 38, points: 8, rebounds: 4, assists: 3 }
  ],
  shoots: [],
  live: { made: 0, miss: 0 },
  fiches: [
    { id: "f1", subjectId: "maths", title: "Nombres relatifs", body: "Un nombre relatif a un signe + ou −. Deux opposés, +5 et −5, font 0. Même signe : on additionne. Signes contraires : on soustrait et on garde le signe du plus grand.", reviewed: false },
    { id: "f2", subjectId: "francais", title: "Le passé simple", body: "Temps du récit écrit. Il raconte une action terminée. Exemple : Il entra, regarda le tableau et s'assit. L'imparfait décrit le décor : Le vent soufflait.", reviewed: false },
    { id: "f3", subjectId: "hg", title: "L'islam, VIIe siècle", body: "Religion née en Arabie. Mahomet à La Mecque puis Médine. Un empire se forme ensuite, de l'Espagne à l'Inde.", reviewed: false },
    { id: "f4", subjectId: "anglais", title: "Present simple", body: "Habitudes et vérités. I play. He plays. Négation : don't / doesn't. Question : Do you play?", reviewed: false }
  ]
};
let state = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(SEED);
    return Object.assign(structuredClone(SEED), JSON.parse(raw));
  } catch { return structuredClone(SEED); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function subjectName(id) { return (SUBJECTS.find(s => s[0] === id) || ["", id])[1]; }
function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&" + "amp;")
    .replace(/</g, "&" + "lt;")
    .replace(/>/g, "&" + "gt;")
    .replace(/"/g, "&" + "quot;")
    .replace(/'/g, "&" + "#39;");
}
function go(view) { state.view = view; save(); render(); }
function todayCourses() {
  const d = new Date().getDay();
  const idx = d === 0 || d === 6 ? -1 : d - 1;
  return state.courses.filter(c => c.day === idx).length;
}
function reviewedCount() { return state.fiches.filter(f => f.reviewed).length; }
function shootPct() {
  const made = state.shoots.reduce((a,s) => a + s.made, 0) + state.live.made;
  const att = state.shoots.reduce((a,s) => a + s.made + s.miss, 0) + state.live.made + state.live.miss;
  return att ? Math.round(made * 100 / att) : 0;
}

function render() {
  const app = document.getElementById("app");
  const titles = {
    hub: ["Quartier général", "Trois zones. Touche un rectangle."],
    emploi: ["Emploi du temps", "Choisis un jour, puis ajoute une matière."],
    basket: { menu: ["Basketball", "Touche un rectangle."], serie: ["Série en cours", "Compte les tirs."], match: ["Match", "Ajoute ou supprime un match."], train: ["Entraînements", "Ajoute ou supprime une séance."] }[state.basket || "menu"],
    fiches: ["Fiches de révision", "Par matière. Amir peut marquer Révisé."]
  };
  const [h, p] = titles[state.view];
  app.innerHTML = `
    <header class="top">
      <button class="brand" data-go="hub"><p class="eyebrow">PONT DE COMMANDEMENT</p><h1>L'AMIRAL</h1></button>
      <div class="chip">Amir · 5ème</div>
    </header>
    <section class="hero"><h2>${esc(h)}</h2><p>${esc(p)}</p></section>
    ${state.view === "hub" ? "" : `<div class="actions"><button class="btn" data-go="hub">← Accueil</button>${state.view === "basket" && state.basket && state.basket !== "menu" ? `<button class="btn" data-basket="menu">← Basketball</button>` : ""}</div>`}
    ${state.view === "hub" ? viewHub() : ""}
    ${state.view === "emploi" ? viewEmploi() : ""}
    ${state.view === "basket" ? viewBasket() : ""}
    ${state.view === "fiches" ? viewFiches() : ""}
  `;
  document.getElementById("dock").innerHTML = [
    ["hub","Accueil"],["emploi","Emploi"],["basket","Basket"],["fiches","Fiches"]
  ].map(([id,label]) =>
    `<button data-go="${id}" class="${state.view===id?"on":""}">${label}</button>`
  ).join("");
}

function viewHub() {
  return `<div class="grid tiles">
    <button class="tile" data-go="emploi"><strong>Emploi du temps</strong><span>${todayCourses()} cours aujourd'hui</span></button>
    <button class="tile" data-go="basket"><strong>Basketball</strong><span>${shootPct()} % aux tirs</span></button>
    <button class="tile wide" data-go="fiches"><strong>Fiches de révision</strong><span>${reviewedCount()} / ${state.fiches.length} révisées</span></button>
  </div>
  <div class="stats">
    <div class="stat"><b>${state.courses.length}</b><span class="muted">créneaux</span></div>
    <div class="stat"><b>${state.matches.length}</b><span class="muted">matchs</span></div>
    <div class="stat"><b>${state.fiches.length}</b><span class="muted">fiches</span></div>
  </div>`;
}

function viewEmploi() {
  const list = state.courses.filter(c => c.day === state.day).sort((a, b) => a.start.localeCompare(b.start));
  const slots = list.map(c => `<div class="tile slot">
      <div><strong>${esc(subjectName(c.subjectId))}</strong><small>${esc(c.start)} – ${esc(c.end)}${c.room ? " · " + esc(c.room) : ""}${c.teacher ? " · " + esc(c.teacher) : ""}</small></div>
      <div class="actions" style="margin:0">
        <button class="btn" data-edit-course="${esc(c.id)}">Modifier</button>
        <button class="btn danger" data-del-course="${esc(c.id)}">Supprimer</button>
      </div>
    </div>`).join("");
  const days = DAYS.slice(0, 5).map((d, i) => `<button class="pill ${state.day===i?"on":""}" data-day="${i}">${d}</button>`).join("");
  return `<div class="days">${days}</div>
    <div class="actions"><button class="btn mint" data-add-course>+ Ajouter</button></div>
    <div class="grid">${slots || `<p class="muted">Aucun cours ce jour. Appuie sur Ajouter.</p>`}</div>`;
}

function viewBasket() {
  if (!state.basket) state.basket = "menu";
  if (state.basket === "serie") return viewSerie();
  if (state.basket === "match") return viewMatches();
  if (state.basket === "train") return viewTrains();
  const att = state.live.made + state.live.miss;
  return `<div class="grid tiles">
    <button class="tile" data-basket="serie"><strong>Série en cours</strong><span>${state.live.made} / ${att}</span></button>
    <button class="tile" data-basket="match"><strong>Match</strong><span>${state.matches.length} match${state.matches.length > 1 ? "s" : ""}</span></button>
    <button class="tile wide" data-basket="train"><strong>Entraînements</strong><span>${state.trainings.length} séance${state.trainings.length > 1 ? "s" : ""}</span></button>
  </div>`;
}

function viewSerie() {
  const att = state.live.made + state.live.miss;
  const pct = att ? Math.round(state.live.made * 100 / att) : 0;
  return `<div class="panel" style="padding:16px">
      <strong style="font-size:28px">${state.live.made} / ${att}</strong>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="score" style="margin-top:12px">
        <button class="ok" data-shoot="made">Marqué</button>
        <button class="no" data-shoot="miss">Raté</button>
      </div>
      <div class="actions">
        <button class="btn" data-shoot-save>Enregistrer la série</button>
        <button class="btn ghost" data-shoot-reset>Remettre à zéro</button>
      </div>
    </div>`;
}

function viewMatches() {
  const matches = state.matches.map(m => `<div class="panel slot"><div><strong>${m.home ? "Domicile" : "Extérieur"} · ${esc(m.opponent)}</strong><small>${esc(m.date)} · ${m.scoreFor}-${m.scoreAgainst} · ${m.points} pts</small></div><button class="btn danger" data-del-match="${esc(m.id)}">Supprimer</button></div>`).join("");
  return `<div class="actions"><button class="btn mint" data-add-match>+ Match</button></div>
    <div class="grid">${matches || `<p class="muted">Aucun match.</p>`}</div>`;
}

function viewTrains() {
  const trains = state.trainings.map(t => `<div class="panel slot"><div><strong>${esc(t.kind)}</strong><small>${DAYS[t.weekday] || "Jour"} · ${esc(t.start)}–${esc(t.end)} · ${esc(t.place)}</small></div><button class="btn danger" data-del-training="${esc(t.id)}">Supprimer</button></div>`).join("");
  return `<div class="actions"><button class="btn mint" data-add-training>+ Entraînement</button></div>
    <div class="grid">${trains || `<p class="muted">Aucune séance.</p>`}</div>`;
}

function viewFiches() {
  const filters = `<button class="pill ${state.subject==="all"?"on":""}" data-subject="all">Toutes</button>` +
    SUBJECTS.map(([id,name]) => `<button class="pill ${state.subject===id?"on":""}" data-subject="${id}">${esc(name)}</button>`).join("");
  const list = state.fiches.filter(f => state.subject === "all" || f.subjectId === state.subject);
  const cards = list.map(f => `<div class="tile fiche" style="padding:18px">
      <strong>${esc(f.title)}</strong>
      <span>${esc(subjectName(f.subjectId))} · ${(f.files || []).length ? (f.files.length + " fichier" + (f.files.length > 1 ? "s" : "") + " · ") : ""}${f.reviewed ? "Révisé" : "À réviser"}</span>
      <div class="actions">
        <button class="btn" data-open-fiche="${esc(f.id)}">Ouvrir</button>
        <button class="btn danger" data-del-fiche="${esc(f.id)}">Supprimer</button>
      </div>
    </div>`).join("");
  return `<div class="actions"><button class="btn mint" data-add-fiche>+ Nouvelle fiche</button><button class="btn" data-pick-new>Importer un fichier</button></div>
    <div class="filters">${filters}</div>
    <div class="grid">${cards || `<p class="muted">Aucune fiche dans cette matière.</p>`}</div>`;
}

function openSheet(html) { document.getElementById("sheet").innerHTML = `<div class="sheet">${html}</div>`; }
function closeSheet() { document.getElementById("sheet").innerHTML = ""; }

document.body.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-day],[data-subject],[data-basket],[data-edit-course],[data-add-course],[data-add-training],[data-shoot],[data-shoot-save],[data-shoot-reset],[data-add-match],[data-add-fiche],[data-open-fiche],[data-close],[data-del-course],[data-del-match],[data-del-training],[data-del-fiche],[data-pick-new],[data-pick-fiche],[data-del-file],[data-open-file]");
  if (!t) {
    if (e.target.id === "sheet" || e.target.classList.contains("sheet")) closeSheet();
    return;
  }
  if (t.dataset.go) {
    if (t.dataset.go === "basket") state.basket = "menu";
    go(t.dataset.go);
  }
  if (t.dataset.basket) { state.basket = t.dataset.basket; save(); render(); }
  if (t.dataset.day) { state.day = Number(t.dataset.day); save(); render(); }
  if (t.dataset.subject) { state.subject = t.dataset.subject; save(); render(); }
  if (t.dataset.close != null) closeSheet();
  if (t.hasAttribute("data-add-course")) courseForm();
  if (t.dataset.editCourse) courseForm(t.dataset.editCourse);
  if (t.dataset.shoot) {
    state.live[t.dataset.shoot] += 1;
    save(); render();
  }
  if (t.hasAttribute("data-shoot-save")) {
    const att = state.live.made + state.live.miss;
    if (att) state.shoots.unshift({ id: crypto.randomUUID(), date: new Date().toISOString().slice(0,10), made: state.live.made, miss: state.live.miss });
    state.live = { made: 0, miss: 0 };
    save(); render();
  }
  if (t.hasAttribute("data-shoot-reset")) { state.live = { made: 0, miss: 0 }; save(); render(); }
  if (t.hasAttribute("data-add-match")) addMatch();
  if (t.hasAttribute("data-add-training")) addTraining();
  if (t.hasAttribute("data-add-fiche")) addFiche();
  if (t.dataset.openFiche) openFiche(t.dataset.openFiche);
  if (t.dataset.delCourse) { state.courses = state.courses.filter(c => c.id !== t.dataset.delCourse); save(); render(); }
  if (t.dataset.delMatch) { state.matches = state.matches.filter(m => m.id !== t.dataset.delMatch); save(); render(); }
  if (t.dataset.delTraining) { state.trainings = state.trainings.filter(x => x.id !== t.dataset.delTraining); save(); render(); }
  if (t.dataset.delFiche) {
    const gone = state.fiches.find(f => f.id === t.dataset.delFiche);
    (gone && gone.files || []).forEach(file => dropFile(file.id));
    state.fiches = state.fiches.filter(f => f.id !== t.dataset.delFiche);
    closeSheet(); save(); render();
  }
  if (t.hasAttribute("data-pick-new")) chooseFiles("new");
  if (t.dataset.pickFiche) chooseFiles(t.dataset.pickFiche);
  if (t.dataset.delFile) removeFicheFile(t.dataset.fiche, t.dataset.delFile);
  if (t.dataset.openFile) openStored(t.dataset.openFile);
});

document.body.addEventListener("submit", async (e) => {
  const form = e.target;
  if (!(form instanceof HTMLFormElement)) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  if (form.dataset.kind === "course") {
    const item = {
      id: form.dataset.id || crypto.randomUUID(),
      day: state.day,
      start: data.start,
      end: data.end,
      subjectId: data.subjectId,
      room: data.room || "",
      teacher: data.teacher || ""
    };
    state.courses = state.courses.filter(c => c.id !== item.id);
    state.courses.push(item);
  }
  if (form.dataset.kind === "training") {
    state.trainings.unshift({
      id: crypto.randomUUID(),
      weekday: Number(data.weekday),
      start: data.start,
      end: data.end,
      place: data.place || "Gymnase",
      kind: data.kind || "Entraînement"
    });
  }
  if (form.dataset.kind === "match") {
    state.matches.unshift({
      id: crypto.randomUUID(),
      date: data.date,
      opponent: data.opponent || "Adversaire",
      home: data.home === "1",
      scoreFor: Number(data.scoreFor || 0),
      scoreAgainst: Number(data.scoreAgainst || 0),
      points: Number(data.points || 0),
      rebounds: 0,
      assists: 0
    });
  }
  if (form.dataset.kind === "fiche" || form.dataset.kind === "import") {
    const id = crypto.randomUUID();
    const filesMeta = [];
    const incoming = form.dataset.kind === "import" ? (pendingImports || []) : [];
    if (form.dataset.kind === "fiche") {
      const input = form.querySelector('input[type="file"]');
      for (const file of (input && input.files) || []) incoming.push(await prepareFile(file));
    }
    for (const prepared of incoming) {
      if (!prepared) continue;
      const fid = crypto.randomUUID();
      await putFile(fid, prepared.blob, prepared.name, prepared.type);
      filesMeta.push({ id: fid, name: prepared.name, type: prepared.type });
    }
    pendingImports = [];
    const fallback = filesMeta[0] ? filesMeta[0].name.replace(/\.[^.]+$/, "") : "Sans titre";
    state.fiches.unshift({
      id,
      subjectId: data.subjectId,
      title: data.title || fallback,
      body: data.body || "",
      reviewed: false,
      files: filesMeta
    });
  }
  if (form.dataset.kind === "review") {
    const f = state.fiches.find(x => x.id === form.dataset.id);
    if (f) f.reviewed = !f.reviewed;
  }
  save();
  closeSheet();
  render();
});

function openFiche(id) {
  const f = state.fiches.find(x => x.id === id);
  if (!f) return;
  const files = (f.files || []).map(file => `<div class="file-row">
      ${fileView(file)}
      <button type="button" class="btn danger" data-del-file="${esc(file.id)}" data-fiche="${esc(f.id)}">Retirer</button>
    </div>`).join("");
  openSheet(`<form class="panel form" data-kind="review" data-id="${esc(f.id)}">
    <p class="eyebrow">${esc(subjectName(f.subjectId))}</p>
    <h2 style="margin:0">${esc(f.title)}</h2>
    <p style="white-space:pre-wrap">${esc(f.body)}</p>
    <div class="files">${files}</div>
    <div class="actions">
      <button class="btn" type="button" data-pick-fiche="${esc(f.id)}">Importer un fichier</button>
      <button class="btn mint" type="submit">${f.reviewed ? "Remettre à réviser" : "Révisé"}</button>
      <button class="btn danger" type="button" data-del-fiche="${esc(f.id)}">Supprimer</button>
      <button class="btn ghost" type="button" data-close>Fermer</button>
    </div>
  </form>`);
  hydrateFiles();
}

let pendingImports = [];
let pickMode = "new";

function fileDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("lamiral-files", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("files");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function putFile(id, blob, name, type) {
  return fileDb().then(d => new Promise((resolve, reject) => {
    const tx = d.transaction("files", "readwrite");
    tx.objectStore("files").put({ blob, name, type }, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function getFile(id) {
  return fileDb().then(d => new Promise((resolve, reject) => {
    const tx = d.transaction("files", "readonly");
    const req = tx.objectStore("files").get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}
function dropFile(id) {
  fileDb().then(d => {
    const tx = d.transaction("files", "readwrite");
    tx.objectStore("files").delete(id);
  }).catch(() => {});
}
function compressImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2200;
      let w = img.width, h = img.height;
      if (w > max || h > max) {
        const r = Math.min(max / w, max / h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        resolve(blob || file);
      }, "image/jpeg", 0.9);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function prepareFile(file) {
  if (!file) return null;
  if ((file.type || "").startsWith("image/")) {
    const blob = await compressImage(file);
    return { blob, name: file.name || "photo.jpg", type: "image/jpeg" };
  }
  if (file.size > 8 * 1024 * 1024) {
    alert("Fichier trop lourd. 8 Mo maximum.");
    return null;
  }
  return { blob: file, name: file.name || "fichier", type: file.type || "application/octet-stream" };
}
function chooseFiles(mode) {
  pickMode = mode;
  document.getElementById("picker").click();
}
document.getElementById("picker").addEventListener("change", async () => {
  const picker = document.getElementById("picker");
  const files = [...picker.files];
  picker.value = "";
  if (!files.length) return;
  if (pickMode === "new") {
    pendingImports = [];
    for (const file of files) {
      const prepared = await prepareFile(file);
      if (prepared) pendingImports.push(prepared);
    }
    if (!pendingImports.length) return;
    const names = pendingImports.map(p => esc(p.name)).join(", ");
    openSheet(`<form class="panel form" data-kind="import">
      <p class="eyebrow">IMPORTER</p>
      <p>${names}</p>
      <label>Matière<select name="subjectId">${SUBJECTS.map(([id,name]) => `<option value="${id}">${esc(name)}</option>`).join("")}</select></label>
      <label>Titre<input name="title" value="${esc(pendingImports[0].name.replace(/\.[^.]+$/, ""))}"></label>
      <div class="actions"><button class="btn mint" type="submit">Enregistrer</button><button class="btn ghost" type="button" data-close>Fermer</button></div>
    </form>`);
    return;
  }
  const fiche = state.fiches.find(x => x.id === pickMode);
  if (!fiche) return;
  fiche.files = fiche.files || [];
  for (const file of files) {
    const prepared = await prepareFile(file);
    if (!prepared) continue;
    const fid = crypto.randomUUID();
    await putFile(fid, prepared.blob, prepared.name, prepared.type);
    fiche.files.push({ id: fid, name: prepared.name, type: prepared.type });
  }
  save();
  openFiche(fiche.id);
});
function fileView(file) {
  const name = file.name || "";
  const type = file.type || "";
  if (type.startsWith("image/")) return `<img alt="${esc(name)}" data-img="${esc(file.id)}">`;
  if (/pdf/i.test(type) || /\.pdf$/i.test(name)) return `<div class="pdf-page" data-pdf="${esc(file.id)}">Chargement du PDF…</div>`;
  if (/^text\//.test(type) || /\.(txt|md)$/i.test(name)) return `<pre data-txt="${esc(file.id)}"></pre>`;
  return `<button type="button" class="btn" data-open-file="${esc(file.id)}">${esc(name)}</button>`;
}
async function hydrateFiles() {
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  }
  for (const img of document.querySelectorAll("[data-img]")) {
    const rec = await getFile(img.dataset.img);
    if (rec) img.src = URL.createObjectURL(rec.blob);
  }
  for (const pre of document.querySelectorAll("[data-txt]")) {
    const rec = await getFile(pre.dataset.txt);
    if (rec) pre.textContent = await rec.blob.text();
  }
  for (const box of document.querySelectorAll("[data-pdf]")) {
    const rec = await getFile(box.dataset.pdf);
    if (!rec || !window.pdfjsLib) {
      box.textContent = "Impossible d'afficher le PDF.";
      continue;
    }
    try {
      const data = await rec.blob.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data }).promise;
      box.textContent = "";
      const cssWidth = Math.max(Math.min(window.innerWidth - 36, box.clientWidth || 360), 320);
      const ratio = Math.min(Math.max(window.devicePixelRatio || 2, 2), 3);
      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const base = page.getViewport({ scale: 1 });
        const viewport = page.getViewport({ scale: (cssWidth * ratio) / base.width });
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = "100%";
        canvas.style.height = "auto";
        box.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      }
    } catch {
      box.textContent = "Impossible d'afficher ce PDF.";
    }
  }
}
async function openStored(id) {
  const rec = await getFile(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.blob);
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.download = rec.name || "fichier";
  a.click();
}
function removeFicheFile(ficheId, fileId) {
  const fiche = state.fiches.find(f => f.id === ficheId);
  if (!fiche) return;
  fiche.files = (fiche.files || []).filter(file => file.id !== fileId);
  dropFile(fileId);
  save();
  openFiche(fiche.id);
}

render();
</script>
